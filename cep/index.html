<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>AuraScript</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span>AuraScript</span> <span id="version" class="muted">v3.0.0</span></div>
    <div class="upd"><span id="update" class="muted"></span><button id="btnUpdate" class="btn small hidden">Mettre à jour</button></div>
  </header>

  <div id="banner" class="banner hidden">
    <div class="banner-title">Nouveautés</div>
    <ul id="bannerList"></ul>
    <button id="bannerOk" class="btn small">OK</button>
  </div>

  <nav class="tabs">
    <button class="tab active" data-page="tools">OUTILS</button>
    <button class="tab" data-page="intro">INTRO</button>
    <button class="tab" data-page="curve">COURBE</button>
    <button class="tab" data-page="presets">PRESETS</button>
  </nav>

  <div id="status" class="status"></div>

  <main id="scroller" class="scroller">
    <!-- ================= OUTILS ================= -->
    <section id="page-tools" class="page">
      <div class="row tools-top">
        <div class="align-grid" id="alignGrid"></div>
        <div class="col grow">
          <button class="btn" data-span="null">Null</button>
          <button class="btn" data-span="text">Text</button>
          <button class="btn" data-span="adjust">Adjustment layer</button>
        </div>
      </div>
      <div class="row">
        <button class="btn grow" id="btnPrecomp">Precomp</button>
        <button class="btn grow" id="btnUncomp">Déprecomp</button>
      </div>
      <button class="btn full" id="btnAnchor">Centrer le point d'ancrage</button>
      <div class="row">
        <button class="btn grow" id="btnReverse" title="Mode miroir : retourne les calques sélectionnés horizontalement">Inverser</button>
        <button class="btn grow" id="btnDuplicate">Dupliquer</button>
      </div>
      <div class="row">
        <div class="pk-wrap">
          <button class="pk-swatch" id="solidSwatch" title="Couleur du solide"></button>
          <div class="picker hidden" id="picker">
            <canvas id="pkSV" class="pk-sv"></canvas>
            <canvas id="pkHue" class="pk-hue"></canvas>
            <div class="pk-presets" id="pkPresets"></div>
            <div class="row center"><span class="muted">#</span><input id="pkHex" class="pk-hex" maxlength="7" spellcheck="false"><button class="btn small" id="pkOk">OK</button></div>
          </div>
        </div>
        <button class="btn grow" id="btnSolid">Solide</button>
      </div>
      <button class="btn full" id="btnPasteImg" title="Copie une image n'importe où (Google, Pinterest : clic droit > Copier l'image), un lien d'image ou un fichier, puis clique ici : elle arrive dans la compo à la tête de lecture, transparence gardée.">Coller l'image</button>
      <div class="row">
        <input id="ttUrl" class="tt-url" placeholder="Colle un lien TikTok ici" spellcheck="false">
        <button class="btn" id="btnTikTok" title="Télécharge la vidéo TikTok et la pose dans la compo à la tête de lecture (touche Entrée aussi)">Entrée</button>
      </div>
      <button class="btn full" id="btnExtractAudio" title="Sélectionne la vidéo TikTok dans la timeline puis clique : le son est mis sur son propre calque audio, juste en dessous">Extraire l'audio</button>
      <div class="row">
        <button class="btn grow" id="btnFaster" title="Les calques sélectionnés vont 2 fois plus vite (2 fois plus courts)">Accélérer x2</button>
        <button class="btn grow" id="btnSlower" title="Les calques sélectionnés vont 2 fois moins vite (2 fois plus longs)">Ralentir x2</button>
      </div>
    </section>

    <!-- ================= INTRO ================= -->
    <section id="page-intro" class="page hidden">
      <div class="section-title">LYRICS</div>
      <div class="muted small-text">Un mot = un texte, calé sur un marqueur</div>
      <button class="btn full" id="btnDetect">Détecter les paroles de la musique</button>
      <textarea id="lyrics" rows="6" placeholder="Colle tes paroles ici"></textarea>
      <div class="row center">
        <label class="muted" for="size">Taille</label>
        <input id="size" type="number" value="150" min="1">
        <select id="preset" class="grow"></select>
        <button class="btn square" id="btnPresetAdd" title="Ajouter un ou plusieurs presets .ffx">+</button>
        <button class="btn square" id="btnPresetDel" title="Retirer le preset choisi de la liste">–</button>
      </div>
      <div class="row">
        <button class="btn primary grow" id="btnLyrics">Créer les paroles</button>
        <button class="btn" id="btnPresetApply" title="Applique le preset choisi aux textes sélectionnés">Appliquer</button>
      </div>
      <div class="row">
        <button class="btn grow" id="btnUpper">Majuscule</button>
        <button class="btn grow" id="btnLower">Minuscule</button>
      </div>
    </section>

    <!-- ================= COURBE ================= -->
    <section id="page-curve" class="page hidden">
      <div class="row center">
        <span class="muted grow" id="libCount"></span>
        <span class="muted">Clés</span>
        <button class="btn toggle square" id="keys2">2</button>
        <button class="btn toggle square" id="keys3">3</button>
      </div>
      <div class="row lib-row">
        <div class="thumbs grow" id="thumbs"></div>
        <button class="btn read" id="btnRead" title="Lit la courbe des keyframes sélectionnées (posée avec Flow ou AuraScript)">Lire clés</button>
      </div>
      <div class="row">
        <button class="btn grow" id="btnNew">Nouvelle</button>
        <button class="btn grow" id="btnDelete">Supprimer</button>
        <button class="btn grow" id="btnImport">Import flow curves</button>
      </div>
      <canvas id="editor" class="editor"></canvas>
      <div class="row">
        <button class="btn primary grow" id="btnApplyCurve">Appliquer</button>
        <button class="btn small" id="btnReset">Reset</button>
        <button class="btn small" id="btnSave">Enregistrer</button>
      </div>
      <div class="row center">
        <span class="muted">1</span><input id="seg1" class="grow" type="text">
        <span class="muted">2</span><input id="seg2" class="grow" type="text">
      </div>
    </section>

    <!-- ================= PRESETS ================= -->
    <section id="page-presets" class="page hidden">
      <div class="row">
        <input id="fxSearch" class="tt-url" placeholder="Rechercher un preset..." spellcheck="false">
      </div>
      <div class="row">
        <button class="btn grow" id="btnFxFiles">+ Presets</button>
        <button class="btn grow" id="btnFxFolder">+ Dossier</button>
        <button class="btn small" id="btnFxRefresh" title="Relire les dossiers ajoutés (nouveaux presets)">↻</button>
        <button class="btn small fx-trash" id="btnFxTrash" title="Supprimer des presets de la liste"><svg viewBox="0 0 16 16" width="13" height="13"><path fill="currentColor" d="M6 1.5h4l.5 1H14v1.5H2V2.5h3.5zM3.2 5h9.6l-.7 9.1c-.05.8-.7 1.4-1.5 1.4H5.4c-.8 0-1.45-.6-1.5-1.4zM6 6.8v6.4h1.2V6.8zm2.8 0v6.4H10V6.8z"/></svg></button>
      </div>
      <div class="muted fx-help">Calque sélectionné : le preset s'applique dessus. Rien de sélectionné : il est mis sur un calque d'effet à la bonne taille.</div>
      <div id="fxDelBar" class="fx-delbar hidden">
        <span id="fxDelInfo">Clique sur les presets à supprimer</span>
        <button class="btn small danger" id="btnFxDelOk" disabled>Supprimer</button>
        <button class="btn small" id="btnFxDelCancel">Annuler</button>
      </div>
      <div id="fxList" class="fx-list"></div>
    </section>
  </main>

  <!-- fenêtre de saisie / confirmation -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div id="modalText" class="modal-text"></div>
      <input id="modalInput" type="text" class="hidden">
      <div class="row end">
        <button class="btn" id="modalCancel">Annuler</button>
        <button class="btn primary" id="modalOk">OK</button>
      </div>
    </div>
  </div>

  <script src="js/lyrics-core.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
